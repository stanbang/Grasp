  <rect x="958" y="322" width="280" height="88" rx="9" fill="#101923" stroke="#263642"/>
  <text x="973" y="354" fill="#8ddbcf" font-size="17" font-weight="650">Compare and record</text>
  <text x="973" y="381" fill="#a4b3bf" font-size="15" font-weight="400">Keep or reject using evidence.</text>
  <path d="M1097 411v26H179v-24m-5 6 5-6 5 6" stroke="#263642" stroke-width="1.5" fill="none"/>
  <text x="40" y="483" fill="#8ddbcf" font-size="17" font-weight="650">Worked example</text>
  <text x="40" y="514" fill="#e7edf1" font-size="16" font-weight="400">Shorter chunks and term reordering each recovered one archived live miss. Retest on unseen notes before changing defaults.</text>
  <text x="40" y="543" fill="#a4b3bf" font-size="15" font-weight="400">Measure claim support, complete request time and provider usage separately.</text>
