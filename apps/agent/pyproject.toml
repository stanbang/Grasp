[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grasp-local-agent"
version = "0.1.0"
description = "Local command-line and MCP clients for the GRASP workspace"
requires-python = ">=3.11"
dependencies = ["mcp==2.3.0", "pydantic>=2.12,<3", "python-dotenv==1.2.4"]

[project.scripts]
grasp = "grasp_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grasp_agent = ["skills/grasp-canvas/SKILL.md"]
