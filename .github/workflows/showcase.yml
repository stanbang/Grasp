name: Publish Grasp case study
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/public/about/**'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: grasp-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/public/about
      - uses: actions/deploy-pages@v4
        id: deploy
